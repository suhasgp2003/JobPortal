{% extends "base.html" %}
{% block title %}Post a Job{% endblock %}

{% block content %}

<style>
    body {
        background: #f7f7f8;
        font-family: "Inter", sans-serif;
    }

    .job-card {
        background: white;
        padding: 32px;
        border-radius: 18px;
        width: 480px;
        border: 1px solid #e7e7e7;
        transition: 0.3s;
    }

    .job-card:hover {
        box-shadow: 0px 10px 30px rgba(0,0,0,0.06);
        transform: translateY(-2px);
    }

    input, select, textarea {
        width: 100%;
        border: 1px solid #d5d5d5;
        padding: 10px;
        border-radius: 10px;
        font-size: 14px;
        transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #4f46e5;
        outline: none;
        box-shadow: 0px 0px 4px rgba(79,70,229,0.3);
    }

    button.submit-btn {
        width: 100%;
        background: #4f46e5;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        transition: 0.3s;
    }

    button.submit-btn:hover {
        background: #4338ca;
        transform: translateY(-2px);
    }

    .back-btn {
        display: block;
        text-align: center;
        margin-top: 12px;
        text-decoration: none;
        font-size: 14px;
        color: #6b6b6b;
    }

    .back-btn:hover {
        color: #4f46e5;
        font-weight: 600;
    }
</style>


<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">

    <div class="job-card">

        <h4 class="text-center fw-bold mb-1">Post a New Job 🎯</h4>
        <p class="text-muted text-center mb-4" style="font-size: 14px;">Fill details and publish instantly</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="submit-btn mt-2">Publish Job</button>
        </form>

        <a href="{% url 'dashboard' %}" class="back-btn">⬅ Back to Dashboard</a>

    </div>
</div>

{% endblock %}
