{% extends "base.html" %}
{% block content %}

<style>
    body {
        background: #f7f9fc;
        font-family: "Poppins", sans-serif;
    }

    .edit-container {
        max-width: 500px;
        margin: 60px auto;
        background: #fff;
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0px 8px 22px rgba(0,0,0,0.08);
        animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
        from {opacity:0; transform: translateY(10px);}
        to {opacity:1; transform: translateY(0);}
    }

    .title {
        text-align: center;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 20px;
        color: #333;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        color: #555;
        margin-bottom: 4px;
        display: block;
    }

    input, textarea, select {
        width: 100%;
        padding: 10px;
        border: 1.8px solid #dcdcdc;
        border-radius: 10px;
        font-size: 14px;
        transition: border .25s;
    }

    input:focus, textarea:focus, select:focus {
        border-color: #5271ff;
        outline: none;
    }

    .btn-save {
        width: 100%;
        padding: 12px;
        background: #5271ff;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        margin-top: 12px;
        transition: .25s;
    }

    .btn-save:hover {
        background: #3e5af5;
        transform: translateY(-2px);
    }

    .cancel {
        display: block;
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
        text-decoration: none;
        color: #666;
        transition: .25s;
    }

    .cancel:hover {
        color: #000;
        text-decoration: underline;
    }
</style>


<div class="edit-container">
    <h2 class="title">✏️ Edit Job</h2>

    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom:15px;">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color:red;">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn-save">Save Changes</button>
        <a href="{% url 'dashboard' %}" class="cancel">Cancel</a>
    </form>
</div>

{% endblock %}
