{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="w-full md:w-1/3 mx-auto form-container mt-12">
    <h3 class="text-center font-bold mb-4">Welcome Back 👋</h3>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <label class="portal-label font-semibold">Username</label>
            <input type="text" name="username" class="portal-field" placeholder="Enter username" required>
        </div>

        <div class="mb-4">
            <label class="portal-label font-semibold">Password</label>
            <input type="password" name="password" class="portal-field" placeholder="Enter password" required>
        </div>

        <button class="portal-button portal-primary w-full mt-4">Login</button>
    </form>

    <p class="text-center mt-4">
        Don't have an account? <a href="{% url 'register' %}" class="font-semibold">Create one</a>
    </p>
</div>
{% endblock %}
